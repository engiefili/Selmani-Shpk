<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Selmani — Hero Preview</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #171919;
    font-family: -apple-system, "Inter", "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .frame {
    width: 100%;
    max-width: 1100px;
  }
  .browser-chrome {
    background: #0d0e0e;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .browser-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,0.25); }
  .url { margin-left: 8px; font-size: 12px; color: rgba(255,255,255,0.4); }

  .hero {
    position: relative;
    height: 640px;
    background: #0a0a0a;
    overflow: hidden;
  }
  .slide {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    opacity: 0;
    transition: opacity 1.1s ease;
  }
  .slide.active { opacity: 1; }
  .slide[data-i="0"] { background-image: url('https://cdn.sanity.io/images/gp1cx0a9/production/c008c9d616796798a90c0f58d0831a909ae93b58-2600x768.jpg?w=1800&q=80'); }
  .slide[data-i="1"] { background-image: url('https://cdn.sanity.io/images/gp1cx0a9/production/3f36e097c4f27d32c18e2bd2a4ec08b8690e4331-706x878.jpg?w=1400&q=80'); }
  .slide[data-i="2"] { background-image: url('https://cdn.sanity.io/images/gp1cx0a9/production/963d720d488eed680b6e9b0f0ac5a93b54f3ac92-706x878.jpg?w=1400&q=80'); }

  .overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(0deg, rgba(10,10,10,0.9), rgba(10,10,10,0.35) 55%, rgba(10,10,10,0.15));
  }

  .content {
    position: relative;
    z-index: 10;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 48px;
    max-width: 85%;
  }
  h1 {
    font-weight: 900;
    line-height: 0.95;
    letter-spacing: -0.02em;
    color: #eaefef;
    font-size: clamp(2.5rem, 6.5vw, 5.5rem);
    min-height: 1.1em;
  }
  .sub {
    margin-top: 20px;
    max-width: 640px;
    font-size: 1.25rem;
    font-weight: 300;
    color: #c1c7c7;
  }

  .footer {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    padding: 24px 48px 32px;
    border-top: 1px solid rgba(255,255,255,0.1);
  }
  .dots { display: flex; gap: 6px; }
  .dots span {
    width: 24px; height: 3px; border-radius: 2px;
    background: rgba(255,255,255,0.25);
    transition: background 0.4s;
  }
  .dots span.active { background: #0F7C82; }
  .cta {
    border: 1px solid #c1c7c7;
    border-radius: 6px;
    padding: 13px 32px;
    font-size: 15px;
    color: #c1c7c7;
    white-space: nowrap;
  }

  .note {
    margin-top: 16px;
    font-size: 13px;
    color: rgba(255,255,255,0.35);
    text-align: center;
  }

  @media (max-width: 640px) {
    .hero { height: 560px; }
    .content { padding: 0 24px; max-width: 100%; }
    .footer { flex-direction: column; align-items: flex-start; padding: 20px 24px 28px; gap: 16px; }
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="browser-chrome">
      <div class="browser-bar">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="url">selmani-shpk.vercel.app</span>
      </div>
      <div class="hero">
        <div class="slide active" data-i="0"></div>
        <div class="slide" data-i="1"></div>
        <div class="slide" data-i="2"></div>
        <div class="overlay"></div>
        <div class="content">
          <h1 id="tagline">WE BUILD IT.</h1>
          <p class="sub">Steel structures and hot-dip galvanizing from one integrated manufacturing partner.</p>
        </div>
        <div class="footer">
          <div class="dots">
            <span class="active" data-i="0"></span>
            <span data-i="1"></span>
            <span data-i="2"></span>
          </div>
          <div class="cta">Explore our work</div>
        </div>
      </div>
    </div>
    <p class="note">Rotating hero mockup — real Selmani project photos, cycles every 3s. Preview only, not live on the site.</p>
  </div>

  <script>
    const words = ["WE BUILD IT.", "WE GALVANIZE IT.", "WE MAKE IT LAST."];
    let i = 0;
    setInterval(() => {
      i = (i + 1) % 3;
      document.querySelectorAll('.slide').forEach(el => el.classList.toggle('active', el.dataset.i == i));
      document.querySelectorAll('.dots span').forEach(el => el.classList.toggle('active', el.dataset.i == i));
      document.getElementById('tagline').textContent = words[i];
    }, 3000);
  </script>
</body>
</html>
